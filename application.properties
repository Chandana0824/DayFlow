spring.application.name=dayflow-hrms-auth
server.port=8080

# ---- SQLite ----
spring.datasource.url=jdbc:sqlite:dayflow.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ---- JWT ----
# CHANGE this secret before deploying anywhere real. Keep it out of git in production.
app.jwt.secret=dayflow-hackathon-super-secret-key-change-me-please-32chars-min
app.jwt.expiration-ms=86400000

# ---- Mail (email verification) ----
# Not needed for the demo — two pre-verified accounts are seeded on startup
# (see config/DataSeeder.java), so you can sign in directly without going
# through sign-up/verification at all. If you DO want to test the real
# sign-up + email-verification flow later, flip this to true and fill in
# your Gmail address + app password.
app.mail.enabled=false
app.mail.from=no-reply@dayflow.app
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.frontend.base-url=http://localhost:5173
